## ============================================================================
## Framework configuration
## ============================================================================
## Any value here can be overridden on the command line:
##   mvn clean test -Dbrowser=firefox -DtestSiteURL=https://www.amazon.in/
##
## Keys read by ConfigManager.get(...). Don't rename without updating
## FrameworkConstants.

## Browser to use. Supported: chrome, firefox, edge, safari (macOS only)
browserName=chrome

## Site under test
testSiteURL=https://www.amazon.in/

## Timeouts in seconds (except polling, which is millis in code)
## implicitWait stays at 0 - we use explicit waits everywhere.
## Mixing implicit + explicit waits causes unpredictable timeouts (documented
## Selenium gotcha).
implicitWait=0
explicitWait=20
pageLoadTimeout=60

## Run browser headless? Set true in CI, false locally for debugging.
headless=false

## Capture screenshot on failure and embed in Extent report
screenshotOnFailure=true

## Number of retries for failed tests (0 = no retry). Use with care - retries
## hide real issues.
retryCount=0

## Environment label - shows up in Extent report header
env=qa
